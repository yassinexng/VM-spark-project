<svg width="2000" height="1500" viewBox="0 0 2000 1500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Straight Indigo Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4A5BA8"/>
    </marker>
  </defs>

  <!-- Lavender Outer Background -->
  <rect width="2000" height="1500" fill="#DCD3F7"/>

  <!-- White Rounded Inner Panel -->
  <rect x="50" y="50" width="1900" height="1400" rx="24" ry="24" fill="#FFFFFF"/>

  <!-- ================= TOP HEADERS (OUTLINED PILLS) ================= -->
  <!-- Col 1 Header: Edge Compute -->
  <rect x="141" y="95" width="190" height="52" rx="26" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="236" y="128" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Edge Compute</text>

  <!-- Col 2 Header: Zero Trust -->
  <rect x="533" y="95" width="170" height="52" rx="26" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="618" y="128" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Zero Trust</text>

  <!-- Col 3 Header: Distributed ETL -->
  <rect x="895" y="95" width="210" height="52" rx="26" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="1000" y="128" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Distributed ETL</text>

  <!-- Col 4 Header: Lakehouse -->
  <rect x="1297" y="95" width="170" height="52" rx="26" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="1382" y="128" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Lakehouse</text>

  <!-- Col 5 Header: Analytics -->
  <rect x="1679" y="95" width="170" height="52" rx="26" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="1764" y="128" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Analytics</text>


  <!-- ================= TOP-LEFT TERRAFORM PILL & ARROW ================= -->
  <!-- Pill above Column 1 Box -->
  <rect x="166" y="185" width="140" height="42" rx="21" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="236" y="212" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">Terraform</text>

  <!-- Thin arrow pointing down into Column 1 Box -->
  <line x1="236" y1="227" x2="236" y2="280" stroke="#4A5BA8" stroke-width="1.5" marker-end="url(#arrow)"/>


  <!-- ================= FIVE COLUMN BOXES ================= -->

  <!-- ===== COLUMN 1 BOX ===== -->
  <rect x="100" y="280" width="272" height="950" rx="18" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <!-- Title -->
  <text x="236" y="360" font-size="23" font-weight="600" fill="#0F172A" text-anchor="middle">Cloud VM Ingestion</text>
  <!-- Lines -->
  <text x="236" y="520" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Synthetic Scaling Engine</text>
  <text x="236" y="660" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Continuous Daemon Loop</text>
  <!-- Bottom Value -->
  <text x="236" y="1150" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">3,000,000 Rows</text>


  <!-- ===== COLUMN 2 BOX ===== -->
  <rect x="482" y="280" width="272" height="950" rx="18" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <!-- Title -->
  <text x="618" y="360" font-size="23" font-weight="600" fill="#0F172A" text-anchor="middle">Secure Mesh Sync</text>
  <!-- Lines -->
  <text x="618" y="500" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Tailscale WireGuard Mesh</text>
  <text x="618" y="620" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Automated File Dispatch</text>
  <text x="618" y="740" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">file1.csv, file2.csv, file3.csv</text>
  <!-- Bottom Value -->
  <text x="618" y="1150" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">~163 MB Encrypted</text>


  <!-- ===== COLUMN 3 BOX ===== -->
  <rect x="864" y="280" width="272" height="950" rx="18" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <!-- Title -->
  <text x="1000" y="360" font-size="23" font-weight="600" fill="#0F172A" text-anchor="middle">PySpark Processing</text>
  <!-- Lines -->
  <text x="1000" y="500" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">local[4] with 4GB heap</text>
  <text x="1000" y="620" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Transformation &amp; Cleaning</text>
  <text x="1000" y="740" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Data Lineage Injection</text>
  <!-- Bottom Value -->
  <text x="1000" y="1150" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">In-Memory Partitioning</text>


  <!-- ===== COLUMN 4 BOX ===== -->
  <rect x="1246" y="280" width="272" height="950" rx="18" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <!-- Title -->
  <text x="1382" y="360" font-size="23" font-weight="600" fill="#0F172A" text-anchor="middle">Azure Lakehouse &amp; SQL</text>
  <!-- Lines -->
  <text x="1382" y="500" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Direct Cloud Object Export</text>
  <text x="1382" y="620" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Serverless SQL Virtualization</text>
  <text x="1382" y="740" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">v_file1, v_file2, v_file3</text>
  <!-- Bottom Value -->
  <text x="1382" y="1150" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Zero-Copy Architecture</text>


  <!-- ===== COLUMN 5 BOX ===== -->
  <rect x="1628" y="280" width="272" height="950" rx="18" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <!-- Title -->
  <text x="1764" y="360" font-size="23" font-weight="600" fill="#0F172A" text-anchor="middle">Apache Superset BI</text>
  <!-- Lines -->
  <text x="1764" y="500" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Docker Compose, Port 8422</text>
  <text x="1764" y="620" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Native Azure SQL Link</text>
  <text x="1764" y="740" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle">Live Market Visualizations</text>
  <!-- Bottom Value -->
  <text x="1764" y="1150" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Sub-Second Queries</text>


  <!-- ================= HORIZONTAL CONNECTORS (BETWEEN BOXES) ================= -->
  <!-- Connector 1 -> 2 (Gap: 372 to 482, Center: 427) -->
  <line x1="372" y1="755" x2="480" y2="755" stroke="#4A5BA8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="377" y="738" width="100" height="34" rx="17" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="427" y="760" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">SCP / P2P</text>

  <!-- Connector 2 -> 3 (Gap: 754 to 864, Center: 809) -->
  <line x1="754" y1="755" x2="862" y2="755" stroke="#4A5BA8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="764" y="738" width="90" height="34" rx="17" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="809" y="760" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">PySpark</text>

  <!-- Connector 3 -> 4 (Gap: 1136 to 1246, Center: 1191) -->
  <line x1="1136" y1="755" x2="1244" y2="755" stroke="#4A5BA8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1146" y="738" width="90" height="34" rx="17" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="1191" y="760" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">wasbs://</text>

  <!-- Connector 4 -> 5 (Gap: 1518 to 1628, Center: 1573) -->
  <line x1="1518" y1="755" x2="1626" y2="755" stroke="#4A5BA8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1523" y="738" width="100" height="34" rx="17" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="1573" y="760" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">T-SQL / TDS</text>


  <!-- ================= RETURN CONNECTOR (BOTTOM) ================= -->
  <!-- Orthogonal line from bottom of Col 1 to bottom of Col 5 -->
  <path d="M 236 1230 L 236 1330 L 1764 1330 L 1764 1230" fill="none" stroke="#4A5BA8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Return Connector Label Pill on the Line -->
  <rect x="940" y="1313" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#4A5BA8" stroke-width="1.5"/>
  <text x="1000" y="1335" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Restart=45s</text>

</svg>